  <circle cx="60" cy="18" r="5.5" fill="#27c93f"/>
  <text class="m" x="420" y="22" text-anchor="middle" fill="#7d8590" font-size="11.5">coredumpdev — zsh</text>
  <g clip-path="url(#t1)"><text class="m" x="24" y="64" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">xxd -l 112 /var/crash/coredumpdev.core</tspan></text></g>
  <text class="m" x="24" y="90" xml:space="preserve"><tspan fill="#6e7681">00000000: </tspan><tspan fill="#5b6570">636f 7265 6475 6d70 6465 7600 0000 0000 </tspan><tspan fill="#3fb950">coredumpdev.....</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1900;0.2260;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="110" xml:space="preserve"><tspan fill="#6e7681">00000010: </tspan><tspan fill="#5b6570">4d75 7a61 6666 6572 2054 6f6c 6761 2059 </tspan><tspan fill="#3fb950">Muzaffer Tolga Y</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2280;0.2640;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="130" xml:space="preserve"><tspan fill="#6e7681">00000020: </tspan><tspan fill="#5b6570">616b 6172 0a5a 6574 6120 4465 6665 6e63 </tspan><tspan fill="#3fb950">akar.Zeta Defenc</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2660;0.3020;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="150" xml:space="preserve"><tspan fill="#6e7681">00000030: </tspan><tspan fill="#5b6570">6520 2f20 4b61 6469 6b6f 792c 2049 5354 </tspan><tspan fill="#3fb950">e / Kadikoy, IST</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3040;0.3400;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="170" xml:space="preserve"><tspan fill="#6e7681">00000040: </tspan><tspan fill="#5b6570">0a73 7973 7465 6d73 202e 2065 6d62 6564 </tspan><tspan fill="#3fb950">.systems . embed</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3420;0.3780;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="190" xml:space="preserve"><tspan fill="#6e7681">00000050: </tspan><tspan fill="#5b6570">6465 6420 2e20 7265 7665 7273 652d 656e </tspan><tspan fill="#3fb950">ded . reverse-en</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3800;0.4160;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="210" xml:space="preserve"><tspan fill="#6e7681">00000060: </tspan><tspan fill="#5b6570">6769 6e65 6572 696e 6700 0000 0000 0000 </tspan><tspan fill="#3fb950">gineering.......</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4180;0.4540;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4900;0.4920;1" dur="5.0s" begin="0s" fill="freeze"/><g clip-path="url(#t2)"><text class="m" x="24" y="240" xml:space="preserve"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">whoami --verbose</tspan></text></g></g>
  <text class="m" x="24" y="266" fill="#8b949e" xml:space="preserve">Systems and embedded engineer at Zeta Defence. I spend most of my<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6500;0.6860;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="286" fill="#8b949e" xml:space="preserve">time a few layers below the framework: kernels, bare-metal MCUs,<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6900;0.7260;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="306" fill="#8b949e" xml:space="preserve">packet paths, and the parts of a program that only make sense in<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7300;0.7660;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="326" fill="#8b949e" xml:space="preserve">a debugger. Occasionally I surface into userland to make pixels<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7700;0.8060;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="346" fill="#8b949e" xml:space="preserve">move fast.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8100;0.8460;1" dur="5.0s" begin="0s" fill="freeze"/></text>
  <text class="m" x="24" y="378" fill="#3fb950" xml:space="preserve">$ </text>
